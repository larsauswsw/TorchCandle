name: Candle
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Candle:
    type: application
    platform: iOS
    sources:
      - path: Candle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.lars-miesner.candle
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FelixCandle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XDKGU98Z87
  CandleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CandleTests
    dependencies:
      - target: Candle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Candle:
    build:
      targets:
        Candle: all
        CandleTests: [test]
    test:
      targets:
        - CandleTests
    run:
      config: Debug
